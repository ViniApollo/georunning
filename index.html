<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>GeoRunning - Início</title>
</head>

<body>

    <header class="header">
        <div class="logo-area">
            <img src="./img/logo/logo-georunning-background-white.jpeg" alt="Logo GeoRunning">
            <h1>
                <span class="geo">GEO</span>
                <span class="running">RUNNING</span>
            </h1>
        </div>
    </header>

    <main>

        <section class="video-container">
            <!-- <img src="./img/thumb.jpg"> -->

            <video class="video" src="./img/video/video.mp4" autoplay muted loop playsinline>
            </video>
            <div class="gradient"></div>

            <h1>
                <span>Patrocinadores:</span>
            </h1>

            <ul class="patrocinadores">
                <li>
                    <a href="https://www.instagram.com/amor_emdetalhespersonalizados/" target="_blank">
                        <img src="./img/patrocinadores/white-no-background/amor-em-detalhes.png"
                            alt="Patrocinador Amor em Detalhes">
                    </a>
                </li>
                <li>
                    <a href="https://www.instagram.com/megapowersuplementos/" target="_blank">
                        <img src="./img/patrocinadores/white-no-background/mega-power.png"
                            alt="Patrocinador Mega Power Suplementos">
                    </a>
                </li>
                <li>
                    <a href="https://www.instagram.com/deferreira5577/" target="_blank">
                        <img src="./img/patrocinadores/no-background/de-paes.png" alt="Patrocinador Dê Pães e Bolos">
                    </a>
                </li>
            </ul>
        </section>

        <section class="video-section">
            <div class="content">

                <div class="video-area">
                    <video src="./img/video/jersey-video.mp4" autoplay muted loop playsinline></video>
                </div>

                <div class="text-area">
                    <h1 class="peita">A PEITA</h1>
                    <h1>
                        AS JERSEYS DA GEORUNNING FORAM CRIADAS PARA QUEM BUSCA PERFORMANCE,
                        CONFORTO E IDENTIDADE EM CADA QUILÔMETRO.
                    </h1>
                </div>
            </div>
        </section>
    </main>
    <footer>
            <h1>EM PRODUÇÃO</h1>
            <H1>©APOLLO</H1>
    </footer>


</body>

</html>
